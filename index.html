<!doctype html>
<html lang="tl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kodigo: Learn by Coding, Improve by Building. Matuto ng Python at Java gamit ang totoong code.">
  <meta property="og:title" content="Kodigo | Learn by Coding, Improve by Building">
  <meta property="og:description" content="Matuto ng Python at Java gamit ang totoong code, hindi puro basa.">
  <meta name="theme-color" content="#FAFAF9">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%234338CA'/%3E%3Ctext x='7' y='27' fill='white' font-family='monospace' font-size='20' font-weight='bold'%3Ek_%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <title>Kodigo | Learn by Coding, Improve by Building</title>
</head>
<body>
  <a class="skip-link" href="#main">Laktaw sa content</a>
  <header class="site-header" id="site-header">
    <div class="header-primary-row">
      <a class="wordmark" href="#/" aria-label="Kodigo, bumalik sa home">kodigo<span aria-hidden="true">_</span></a>
      <div class="language-switcher" id="language-switcher" role="radiogroup" aria-label="Pumili ng language">
        <button class="language-option" type="button" role="radio" aria-checked="true" data-nav-lang="python">Python</button>
        <button class="language-option" type="button" role="radio" aria-checked="false" data-nav-lang="java">Java</button>
      </div>
      <div class="header-tools">
        <button class="icon-button search-toggle" id="search-toggle" type="button" aria-label="Buksan ang search" title="Search (/)" hidden>⌕</button>
        <form class="search-form" id="search-form" role="search">
          <label class="sr-only" for="search-input">Maghanap ng lesson</label>
          <input id="search-input" type="search" placeholder="Maghanap ng lesson..." autocomplete="off">
          <kbd>/</kbd>
        </form>
        <a class="button quiz-button" href="#/quiz" aria-label="Quiz"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3 2.5h10v11H3zM5.5 5h5M5.5 8h5M5.5 11h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Quiz</span></a>
        <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Palitan ang theme" title="Palitan ang theme">◐</button>
        <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Buksan ang navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
      </div>
    </div>
  </header>
  <div class="search-results" id="search-results" hidden></div>
  <div class="script-error-banner" id="script-error-banner" role="status" aria-live="polite" hidden></div>
  <div class="app-layout">
    <div class="drawer-scrim" id="drawer-scrim" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="Course navigation">
      <div class="sidebar-top"><button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Isara ang navigation">×</button></div>
      <nav id="course-nav" class="sidebar-middle" aria-label="Mga lesson"></nav>
      <div class="sidebar-bottom">
        <a class="sidebar-bottom-row" href="#/kodigo-ko" aria-label="Kodigo ko"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 1.5 9.9 5.4l4.3.6-3.1 3 .7 4.3L8 11.2l-3.8 2.1.7-4.3-3.1-3 4.3-.6L8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span>Kodigo ko</span></a>
        <div class="sidebar-bottom-row streak"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 1.5c.7 2.7-2.7 3.4-1.7 6.1.5 1.2 1.6 1.1 1.7-.2 2.2 1.3 3.3 3.1 2.4 5.1a3.1 3.1 0 0 1-5.9-1.1C4.4 8 7.2 6 8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span id="streak-count">0-day streak</span></div>
      </div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script>
    window.kodigoScriptError = function (file) {
      var banner = document.getElementById("script-error-banner");
      banner.textContent = "Hindi ma-load ang " + file + ". I-check na nasa folder ito at i-reload ang Kodigo.";
      banner.hidden = false;
    };
    window.addEventListener("error", function (event) {
      if (!event.filename || event.filename.indexOf(".js") === -1) return;
      var file = event.filename.split("/").pop();
      window.kodigoScriptError(file);
    });
  </script>
  <!-- Script order: curriculum and shared data, quizzes, history and lessons, utilities, features, pages, UI, then main bootstrap. -->
  <script defer src="data/curriculum.js" onerror="kodigoScriptError('data/curriculum.js')"></script>
  <script defer src="data/copy.js" onerror="kodigoScriptError('data/copy.js')"></script>
  <!-- Quiz registry: add quiz banks here. -->
  <script defer src="data/quiz/python.js" onerror="kodigoScriptError('data/quiz/python.js')"></script>
  <script defer src="data/quiz/java.js" onerror="kodigoScriptError('data/quiz/java.js')"></script>
  <!-- History registry. -->
  <script defer src="data/history/python.js" onerror="kodigoScriptError('data/history/python.js')"></script>
  <script defer src="data/history/java.js" onerror="kodigoScriptError('data/history/java.js')"></script>
  <!-- Lesson registry: add one script tag per lesson data file. -->
  <script defer src="data/lessons/python/variables-and-data-types.js" onerror="kodigoScriptError('data/lessons/python/variables-and-data-types.js')"></script>
  <script defer src="data/lessons/python/conditional-statements.js" onerror="kodigoScriptError('data/lessons/python/conditional-statements.js')"></script>
  <script defer src="data/lessons/python/loops.js" onerror="kodigoScriptError('data/lessons/python/loops.js')"></script>
  <script defer src="data/lessons/python/functions.js" onerror="kodigoScriptError('data/lessons/python/functions.js')"></script>
  <script defer src="data/lessons/java/java-fundamentals.js" onerror="kodigoScriptError('data/lessons/java/java-fundamentals.js')"></script>
  <script defer src="data/lessons/java/conditional-statements.js" onerror="kodigoScriptError('data/lessons/java/conditional-statements.js')"></script>
  <script defer src="data/lessons/java/loops.js" onerror="kodigoScriptError('data/lessons/java/loops.js')"></script>
  <script defer src="data/lessons/java/methods.js" onerror="kodigoScriptError('data/lessons/java/methods.js')"></script>
  <script defer src="data/lessons/generated.js" onerror="kodigoScriptError('data/lessons/generated.js')"></script>
  <script defer src="js/store.js" onerror="kodigoScriptError('js/store.js')"></script>
  <script defer src="js/router.js" onerror="kodigoScriptError('js/router.js')"></script>
  <script defer src="js/features/annotatedCode.js" onerror="kodigoScriptError('js/features/annotatedCode.js')"></script>
  <script defer src="js/features/runner.js" onerror="kodigoScriptError('js/features/runner.js')"></script>
  <script defer src="js/features/predictOutput.js" onerror="kodigoScriptError('js/features/predictOutput.js')"></script>
  <script defer src="js/features/debugMode.js" onerror="kodigoScriptError('js/features/debugMode.js')"></script>
  <script defer src="js/features/reorderLines.js" onerror="kodigoScriptError('js/features/reorderLines.js')"></script>
  <script defer src="js/features/miniProject.js" onerror="kodigoScriptError('js/features/miniProject.js')"></script>
  <script defer src="js/features/practice.js" onerror="kodigoScriptError('js/features/practice.js')"></script>
  <script defer src="js/features/animations.js" onerror="kodigoScriptError('js/features/animations.js')"></script>
  <script defer src="js/features/kodigoCard.js" onerror="kodigoScriptError('js/features/kodigoCard.js')"></script>
  <script defer src="js/lessonData.js" onerror="kodigoScriptError('js/lessonData.js')"></script>
  <script defer src="js/pages/history.js" onerror="kodigoScriptError('js/pages/history.js')"></script>
  <script defer src="js/ui/nav.js" onerror="kodigoScriptError('js/ui/nav.js')"></script>
  <script defer src="js/ui/drawer.js" onerror="kodigoScriptError('js/ui/drawer.js')"></script>
  <script defer src="js/main.js" onerror="kodigoScriptError('js/main.js')"></script>
</body>
</html>
